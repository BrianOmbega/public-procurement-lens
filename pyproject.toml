[project]
name = "procurement-lens"
version = "0.1.0"
description = "Public Procurement Lens — agentic evaluation of Kenyan public tenders (Bid Box Challenge, Governance track)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "mcp[cli]>=2,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "ijson>=3.2",
]

[project.scripts]
lens-stub = "lens.stubs.stub_mcp:main"
lens-demo = "lens.demo:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
